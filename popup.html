<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; width: 240px; margin: 12px; }
    button { display: block; width: 100%; padding: 8px; margin-bottom: 8px; font-size: 13px; cursor: pointer;
             border: 1px solid #c4c7c5; border-radius: 6px; background: #fff; }
    button:hover { background: #f1f3f4; }
    button:disabled { opacity: .5; cursor: default; }
    label { display: flex; gap: 6px; align-items: center; margin: 4px 0 10px; color: #444; }
    #status { min-height: 1.2em; color: #555; font-size: 12px; }
    #status.err { color: #b3261e; }
  </style>
</head>
<body>
  <button id="copy">Copy as Markdown</button>
  <button id="download">Download .md</button>
  <label><input type="checkbox" id="strip" checked> Strip quoted replies</label>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
